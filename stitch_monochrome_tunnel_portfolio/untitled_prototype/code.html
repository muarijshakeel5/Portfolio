<style>
        /* Base / Environment */
        body {
            background-color: #080808; /* Requested pure black base */
            overflow: hidden; /* No scrollbars */
            color: #ffffff;
            cursor: default;
        }

        /* Film Grain Overlay */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        /* 3D Tunnel Transition Setup */
        .tunnel-container {
            perspective: 1200px;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
        }

        .tunnel-content {
            transform-style: preserve-3d;
            animation: tunnelIntro 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            height: 100%;
            width: 100%;
        }

        @keyframes tunnelIntro {
            0% {
                transform: translateZ(-800px) scale(0.8);
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                transform: translateZ(0) scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        /* Hero Image Styling */
        .hero-image-wrapper {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 65vw; /* Fills right side mostly */
            height: 100vh;
            z-index: 1;
            transform-origin: center right;
            transition: transform 0.5s ease-out;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: bottom right;
            filter: grayscale(18%) contrast(1.04);
            mask-image: linear-gradient(to right, transparent 0%, black 20%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%);
        }

        /* Depth Lines */
        .depth-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 10vw 10vh;
        }

        /* Brutalist Details */
        .hard-shadow-box {
            border: 1px solid #f2f0ec;
            box-shadow: 2px 2px 0px 0px #f2f0ec;
            transition: all 0.2s ease;
        }
        
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

<!-- Parallax / 3D Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('parallax-layer');
            const heroImg = document.getElementById('hero-img-container');
            
            // Subtle Parallax on Mouse Move
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                
                // Rotate container slightly for 3D tunnel feel
                container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                
                // Counter-shift the image to give depth
                heroImg.style.transform = `translate3d(${xAxis * -1.5}px, ${yAxis * -1.5}px, 0) scale(1.02)`;
            });

            // Reset on leave
            document.addEventListener('mouseleave', () => {
                container.style.transform = `rotateY(0deg) rotateX(0deg)`;
                heroImg.style.transform = `translate3d(0px, 0px, 0) scale(1)`;
                container.style.transition = 'transform 0.5s ease';
                heroImg.style.transition = 'transform 0.5s ease';
            });
            
            // Remove transition during move for responsiveness
            document.addEventListener('mouseenter', () => {
                container.style.transition = 'none';
                heroImg.style.transition = 'none';
            });
        });
    </script>
