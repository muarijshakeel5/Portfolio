<style>
        body {
            background-color: #080808;
            color: #e5e2e1;
            margin: 0;
            overflow: hidden; /* 100vh/100vw fixed */
            position: relative;
        }

        /* Film Grain Overlay */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Staggered Fade Up Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUpAnim 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUpAnim {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-600 { animation-delay: 600ms; }

        /* Tech Stack Row Hover (Minimalist/Brutalist physical switch feel) */
        .tech-row {
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .tech-row:hover {
            background-color: #0d0d0d;
            transform: translate(2px, 2px);
            box-shadow: -2px -2px 0 0 #1e1e1e; /* Reverse shadow for physical press */
        }

        /* Pill hover */
        .tech-pill {
            transition: all 0.2s ease;
        }
        .tech-pill:hover {
            background-color: #f2f0ec;
            color: #080808;
            border-color: #f2f0ec;
        }

        /* 3D Tunnel Logic Background Gradient (Subtle) */
        .tunnel-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 150vh;
            background: radial-gradient(circle at center, rgba(13,13,13,0) 20%, rgba(8,8,8,1) 80%);
            pointer-events: none;
            z-index: -1;
        }
    </style>

<script>
        // Optional: Add simple mouse movement parallax for the tunnel effect to enhance 3D feel
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20; // max 20px movement
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            
            const tunnel = document.querySelector('.tunnel-bg');
            if(tunnel) {
                tunnel.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            }
        });
