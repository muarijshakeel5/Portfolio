        /* Film Grain Filter */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Blinking Cursor Animation */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink {
            animation: blink 1s step-end infinite;
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: currentColor;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        /* 3D Tunnel Logic / Terminal Container Depth */

            box-shadow: 0 0 0 1px #1e1e1e, 2px 2px 0 0 #f2f0ec;
            transform: translateZ(0); /* Hardware accel */
        }
        
        body {
            background-color: #080808;
            color: #e5e2e1; /* on-surface roughly */
        }
    </style>

<script>
        const terminalOutput = document.getElementById('terminal-output');
        const codeSnippet = `const developer = {
  name: 'Yusuf Nur',
  role: 'Creative Developer & UI Engineer',
  location: 'Global',
  skills: [
    'JavaScript', 'TypeScript', 'React', 'Vue',
    'Three.js', 'WebGL', 'Tailwind CSS', 'Figma'
  ],
  passion: 'Bridging the gap between design and engineering.',
  status: 'Available for freelance projects.',
  contact: () => {
    return 'yusuf@yn-sys.dev';
  }
};

> developer.contact();
"yusuf@yn-sys.dev"`;

        let i = 0;
        const speed = 30; // typing speed in milliseconds

        function typeWriter() {
            if (i < codeSnippet.length) {
                // Ensure HTML formatting isn't messed up by typing raw characters
                terminalOutput.innerHTML = codeSnippet.substring(0, i + 1) + '<span class="cursor-blink"></span>';
                i++;
                setTimeout(typeWriter, speed);
            } else {
                // Keep cursor blinking at the end
                terminalOutput.innerHTML = codeSnippet + '<span class="cursor-blink"></span>';
            }
        }

        // Start typing after a short delay
        setTimeout(typeWriter, 800);
    </script>
